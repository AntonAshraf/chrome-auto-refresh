<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>

<div class="header">
    <img class="app-icon" src="icons/256.png" alt="Auto Refresh icon">
    <h3>Auto Refresh</h3>
</div>

<label for="tabList">Tabs</label>
<div class="helper">Click items to select multiple tabs</div>
<div id="tabList" class="tab-list" role="list"></div>

<br>

<div class="controls-grid">
    <div class="control-column">
        <label class="controls-label" for="interval">Seconds</label>
        <div>
            <input id="interval" type="number" min="1" value="10">
        </div>
    </div>
    <div class="control-column">
        <label class="controls-label" for="hardEvery">Hard Reload Every</label>
        <div>
            <select id="hardEvery">
                <option>1</option>
                <option selected>5</option>
                <option>10</option>
                <option>20</option>
                <option>50</option>
            </select>
        </div>
    </div>
</div>

<br><br>

<label class="checkbox-row">
    <input id="rotateActiveTabs" type="checkbox" checked>
    <span>Rotate active tab after each refresh</span>
</label>

<br>

<label class="checkbox-row">
    <input id="notifyOnContentChange" type="checkbox">
    <span>Track selected tab content changes</span>
</label>

<br>

<button id="openDashboard" class="secondary-button" type="button">Open dashboard</button>

<br>

<button id="toggle" class="start-button">Start</button>


<div class="status-row">
    <div class="status-item">Countdown: <span id="countdown">-</span></div>
    <div class="status-item">Refreshes: <span id="count">0</span></div>
</div>

<script src="popup.js"></script>

</body>
</html>
