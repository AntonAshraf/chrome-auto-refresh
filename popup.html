<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>

<div class="header">
    <img class="app-icon" src="icons/256.png" alt="Auto Refresh icon">
    <h3>Auto Refresh</h3>
</div>

<label for="tabSelect">Tabs</label>
<div class="helper">Ctrl/Cmd click to select multiple tabs.</div>
<select id="tabSelect" multiple size="6"></select>

<br><br>

<label>Seconds</label>
<input id="interval" type="number" min="1" value="10">

<br><br>

<label>Hard Reload Every</label>
<select id="hardEvery">
    <option>5</option>
    <option selected>10</option>
    <option>20</option>
    <option>50</option>
</select>

<br><br>

<label class="checkbox-row">
    <input id="rotateActiveTabs" type="checkbox" checked>
    <span>Rotate active tab after each refresh</span>
</label>

<br>

<button id="toggle" class="start-button">Start</button>

<hr>

<div>Countdown: <span id="countdown">-</span></div>
<div>Refreshes: <span id="count">0</span></div>

<script src="popup.js"></script>

</body>
</html>
